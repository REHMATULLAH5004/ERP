<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Now Serving - Griffins Medicals Limited</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase-config.js"></script>

    <!--
    Standalone kiosk page, same pattern as clock-in.html / the QR
    clock-in station -- meant to run unattended, full-screen, on a
    browser left open on the waiting-room TV. Nobody logs in here: it
    reads via the `anon` role, which database/queue_module_schema.sql
    grants read-only access to (today's tickets only, and only the
    columns needed to display them -- no phone/NHIMA number/customer_id).

    Updates live via Supabase Realtime (postgres_changes on
    queue_tickets), with a plain poll every 5s as a fallback in case
    Realtime hasn't been switched on for this project yet.

    Voice announcements (browser Web Speech API -- no external service,
    works offline) read out each newly-called token, and the page
    reloads itself once a day at a fixed off-hours time to keep a
    screen that's left running for weeks from slowly accumulating
    memory/connection cruft. See the "ADDED" comments in the script
    below for how each works and their trade-offs.

    🔥 CHANGED: "Now Serving" is a table (Counter | Patient) with one
    row per counter, instead of a single hero number -- Billing has 3
    counters (Counter 1/2/3) that can all be serving different patients
    at once, so a single "now serving" box was hiding whichever ones
    weren't the most-recently-called. See COUNTERS/renderStage() below.

    🔥 CHANGED AGAIN: the board is now ANIMATED -- waiting patients stand
    in a waiting area, walk to the counter when called, and walk on to the
    dispensing queue / out when finished (Billing: Counter 1-3, Dispensing:
    Dispensing 1-3). See "ANIMATED BOARD" in the script below. Voice, chime,
    realtime, the 5s poll and the 3 AM reload are unchanged.
    -->

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; overflow: hidden; }
        body {
            position: relative;
            font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            background: #e9f1f8;
            color: #0f172a;
        }
        /* Everything is laid out on a fixed 1920x1080 board that is scaled to
           fit whatever screen/TV the page is opened on (see fitBoard()). */
        #tv {
            position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
            transform-origin: 0 0; overflow: hidden;
            background: linear-gradient(180deg, #e9f1f8 0%, #f5f9fc 100%);
        }
        .abs { position: absolute; }
        .top { left: 0; top: 0; width: 1920px; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 40px; background: #fff; border-bottom: 1px solid #d6e2ee; }
        .brand { font-size: 26px; font-weight: 700; color: #0f3d7a; letter-spacing: .3px; display: flex; align-items: center; gap: 10px; }
        .brand i { color: #2563eb; }
        .top-right { display: flex; align-items: center; gap: 20px; }
        .clock { font-size: 28px; font-weight: 600; color: #475569; font-variant-numeric: tabular-nums; }
        #voiceToggleBtn { background: #f1f5f9; border: 1px solid #cbd5e1; color: #475569; border-radius: 8px; padding: 8px 14px; font-size: 20px; cursor: pointer; }

        .b { --c: #0f4fa8; --c2: #2563eb; --soft: #e3eefc; --floor: #eef4fc; }
        .g { --c: #0e7a4a; --c2: #16a05f; --soft: #e2f4ea; --floor: #eef8f2; }

        .banner { position: relative; width: 912px; height: 100px; border-radius: 12px; background: var(--c); color: #fff; text-align: center; padding-top: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
        .banner h1 { font-size: 54px; line-height: 1; font-weight: 800; letter-spacing: 2px; }
        .banner p { font-size: 24px; margin-top: 4px; font-weight: 600; opacity: .95; }
        .bl, .br { position: absolute; top: 0; height: 100px; display: flex; align-items: center; gap: 12px; }
        .bl { left: 26px; } .br { right: 26px; }
        .bl .n { font-size: 60px; font-weight: 800; line-height: 1; min-width: 40px; text-align: center; }
        .bl .t { font-size: 22px; font-weight: 600; opacity: .9; text-align: left; }
        .br .nx { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
        .br .nx b { font-size: 40px; letter-spacing: 0; background: #fff; color: var(--c); border-radius: 10px; padding: 0 16px; line-height: 1.15; font-variant-numeric: tabular-nums; min-width: 90px; }

        /* counter card */
        .cc { position: absolute; width: 288px; height: 396px; background: #fff; border-radius: 14px; border: 3px solid var(--soft); overflow: hidden; box-shadow: 0 3px 10px rgba(15,23,42,.08); transition: border-color .3s, box-shadow .3s; }
        .plate { height: 56px; background: var(--c2); color: #fff; font-size: 26px; font-weight: 700; text-align: center; padding-top: 12px; padding-left: 44px; position: relative; }
        .circle { position: absolute; left: 12px; top: 7px; width: 40px; height: 40px; border-radius: 50%; background: #fff; color: var(--c); font-weight: 800; font-size: 24px; display: flex; align-items: center; justify-content: center; border: 3px solid var(--c); padding: 0; }
        .art { position: relative; height: 150px; background: linear-gradient(#f4f8fc, #e8eff7); overflow: hidden; }
        .art .clerk { position: absolute; left: 112px; top: 14px; width: 64px; height: 128px; }
        .desk { position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: var(--c); border-top: 8px solid var(--c2); }
        .desk:after { content: ""; position: absolute; left: 18px; right: 18px; top: 14px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); }
        .monitor { position: absolute; left: 30px; bottom: 66px; width: 54px; height: 38px; background: #1e293b; border-radius: 4px; border: 3px solid #334155; }
        .monitor:after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -12px; height: 9px; background: #334155; }
        .monitor i { position: absolute; left: 6px; right: 6px; top: 7px; height: 3px; background: #38bdf8; box-shadow: 0 7px 0 #38bdf8, 0 14px 0 #7dd3fc; }
        .zone { position: relative; height: 190px; background: var(--floor); border-top: 3px solid var(--soft); }
        .info { position: absolute; left: 98px; right: 2px; top: 12px; text-align: center; }
        .lab { font-size: 15px; white-space: nowrap; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #64748b; min-height: 20px; }
        .tok { font-size: 60px; line-height: 1.05; font-weight: 800; color: var(--c); font-variant-numeric: tabular-nums; }
        .pn { font-size: 23px; font-weight: 600; color: #1e293b; line-height: 1.15; word-break: break-word; }
        .cc.idle .tok { font-size: 48px; color: #b6c2d0; }
        .cc.idle .pn { color: #94a3b8; font-size: 20px; font-weight: 500; }
        .cc.serving { border-color: var(--c2); }
        .cc.called { border-color: #f59e0b; box-shadow: 0 0 0 7px rgba(245,158,11,.30), 0 3px 10px rgba(15,23,42,.1); animation: pulse 1s ease-in-out infinite; }
        .cc.called .lab { color: #b45309; }
        @keyframes pulse { 50% { box-shadow: 0 0 0 13px rgba(245,158,11,.10), 0 3px 10px rgba(15,23,42,.1); } }

        /* waiting area */
        .qz { width: 912px; height: 190px; border-radius: 14px; background: var(--floor); border: 3px solid var(--soft); }
        .qz .floor { position: absolute; left: 0; right: 0; bottom: 12px; height: 3px; background: repeating-linear-gradient(90deg, #cbd8e6 0 18px, transparent 18px 30px); }
        .qz .empty { position: absolute; left: 0; right: 0; top: 70px; text-align: center; font-size: 28px; color: #94a3b8; font-weight: 600; }
        .more { position: absolute; right: 18px; top: 12px; font-size: 24px; font-weight: 700; color: var(--c); background: #fff; border-radius: 30px; padding: 6px 16px; border: 2px solid var(--soft); }
        .pill { width: 912px; height: 74px; background: var(--c); color: #fff; border-radius: 40px; padding: 0 28px; font-size: 26px; font-weight: 600; display: flex; align-items: center; gap: 18px; box-shadow: 0 4px 12px rgba(0,0,0,.14); }

        /* people */
        #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; z-index: 10; }
        .fig { position: absolute; left: 0; top: 0; width: 64px; height: 128px; will-change: transform; }
        .fig .flip { position: absolute; inset: 0; transition: transform .2s; }
        .fig svg { width: 64px; height: 128px; overflow: visible; display: block; }
        .fig .shadow { position: absolute; left: 8px; bottom: -4px; width: 48px; height: 10px; border-radius: 50%; background: rgba(15,23,42,.14); }
        .tag { position: absolute; left: 50%; top: -36px; transform: translateX(-50%); white-space: nowrap; background: var(--c2, #2563eb); color: #fff; font-weight: 800; font-size: 24px; border-radius: 10px; padding: 1px 12px; font-variant-numeric: tabular-nums; box-shadow: 0 2px 6px rgba(0,0,0,.18); }
        .tag.pri { box-shadow: 0 0 0 3px #f59e0b; }
        .tag.next:after { content: "UP NEXT"; position: absolute; left: 50%; transform: translateX(-50%); top: -17px; font-size: 12px; letter-spacing: 1.5px; color: #fff; background: #f59e0b; border-radius: 6px; padding: 0 6px; }
        .nm { position: absolute; left: 50%; top: 136px; transform: translateX(-50%); font-size: 18px; font-weight: 600; color: #475569; white-space: nowrap; max-width: 110px; overflow: hidden; text-overflow: ellipsis; }
        .fig.hidetag .tag, .fig.hidetag .nm { display: none; }
        .fig .lg { transform-box: fill-box; transform-origin: 50% 0; }
        .fig .ar { transform-box: fill-box; transform-origin: 50% 8%; }
        .fig.walk .legL { animation: swA .5s ease-in-out infinite alternate; }
        .fig.walk .legR { animation: swB .5s ease-in-out infinite alternate; }
        .fig.walk .armL { animation: swB .5s ease-in-out infinite alternate; }
        .fig.walk .armR { animation: swA .5s ease-in-out infinite alternate; }
        .fig.walk .flip { animation: bob .25s ease-in-out infinite alternate; }
        @keyframes swA { from { transform: rotate(-26deg); } to { transform: rotate(26deg); } }
        @keyframes swB { from { transform: rotate(26deg); } to { transform: rotate(-26deg); } }
        @keyframes bob { from { margin-top: 0; } to { margin-top: -4px; } }
        .fig.idle .flip { animation: breathe 3.2s ease-in-out infinite; animation-delay: var(--d, 0s); }
        @keyframes breathe { 50% { margin-top: -2px; } }
        .fig.serve .armR { animation: give 2.4s ease-in-out infinite; }
        @keyframes give { 0%, 100% { transform: rotate(0); } 30%, 60% { transform: rotate(-70deg); } }
        .clerk .armL { animation: type .5s ease-in-out infinite alternate; }
        .clerk .armR { animation: type .5s ease-in-out infinite alternate-reverse; }
        .clerk .ar { transform-box: fill-box; transform-origin: 50% 8%; }
        @keyframes type { from { transform: rotate(-10deg); } to { transform: rotate(14deg); } }
        .clerk .hd { animation: nod 3s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
        @keyframes nod { 50% { transform: rotate(4deg); } }

        #soundGate {
            position: fixed; inset: 0; background: rgba(15,23,42,0.92);
            display: flex; align-items: center; justify-content: center; z-index: 999;
        }
        #soundGate button {
            background: #2563eb; color: white; border: none; padding: 18px 36px;
            border-radius: 10px; font-size: 1.2rem; cursor: pointer; font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="soundGate">
        <button id="soundGateBtn"><i class="fa-solid fa-volume-high"></i> Tap to Start Display (Sound &amp; Voice)</button>
    </div>

    <div id="tv">
        <div class="abs top">
            <div class="brand"><i class="fa-solid fa-globe"></i> Griffins Medicals Limited</div>
            <div class="top-right">
                <button id="voiceToggleBtn" title="Turn voice announcements on/off">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <div class="clock" id="tvClock">--:--:--</div>
            </div>
        </div>
        <div id="root"></div>
        <div id="stage"></div>
    </div>
    <script>
    (function initTvDisplay() {
        if (typeof supabaseClient === 'undefined') {
            document.body.innerHTML = '<p style="padding:40px;color:#f87171;">supabaseClient is not defined -- check assets/js/supabase-config.js.</p>';
            return;
        }

        // ============================================
        // CLOCK
        // ============================================
        function tickClock() {
            document.getElementById('tvClock').textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        tickClock();
        setInterval(tickClock, 1000);

        // ============================================
        // 🔥 ADDED: VOICE ANNOUNCEMENTS (Web Speech API)
        // ============================================
        // Reads out "Token number X, Patient Name, please proceed to
        // Counter Y" whenever a new patient is called, on top of the
        // chime -- so someone doesn't have to be looking at the screen
        // to catch their number. Uses the browser's own built-in
        // text-to-speech (SpeechSynthesis), same as a phone's
        // accessibility voice -- no account, API key, or internet
        // service needed. Two real constraints worth knowing:
        //   1. Browsers block audio AND speech until a real tap/click
        //      happens on the page (the same "Tap to Start Display" gate
        //      already here for the chime covers this -- it also fires
        //      one throwaway utterance below to fully unlock speech).
        //   2. Available voices depend entirely on what's installed on
        //      whatever device/browser is actually driving the TV --
        //      a laptop or Android box running Chrome will have several
        //      English voices; some bare-bones smart-TV browsers may
        //      have none, in which case this silently does nothing and
        //      the chime + visual board still work exactly as before.
        // A small speaker icon top-right lets staff mute/unmute voice
        // without touching code; the choice is remembered per-browser.
        let voiceEnabled = localStorage.getItem('tvVoiceEnabled') !== 'false';
        let cachedVoice = null;

        function pickVoice() {
            if (cachedVoice) return cachedVoice;
            if (!('speechSynthesis' in window)) return null;
            const voices = speechSynthesis.getVoices();
            cachedVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('en')) || voices[0] || null;
            return cachedVoice;
        }
        if ('speechSynthesis' in window) {
            speechSynthesis.onvoiceschanged = () => { cachedVoice = null; pickVoice(); };
        }

        // 🔥 FIX: known Chrome/Edge bug (chromium issue 679437) -- the
        // browser's speech engine silently stops producing any audio once
        // it's gone roughly 15 seconds without speaking, and never
        // recovers on its own. Confirmed this is exactly the situation
        // here: a TV display can easily sit for minutes between calls, so
        // voice would work right after the "Tap to Start" gate, then go
        // completely silent later with no error anywhere -- looking
        // "broken" even though the code triggering it is fine. Chrome's
        // own documented workaround is to periodically pause() then
        // immediately resume() while nothing is actively mid-sentence --
        // that resets its internal timer without audibly interrupting
        // anything. Runs the whole time the page is open, independent of
        // whether an announcement is currently in progress.
        if ('speechSynthesis' in window) {
            setInterval(() => {
                if (speechSynthesis.speaking) {
                    speechSynthesis.pause();
                    speechSynthesis.resume();
                }
            }, 10000);
        }

        // Tracks when the most recent utterance was actually handed to
        // speechSynthesis, so speak() below can tell "still genuinely
        // talking" apart from "stuck/jammed" -- see the comment there.
        let lastSpeakStartedAt = 0;
        // No real announcement here ever runs anywhere near this long
        // (even the longest "Token number X. Full Patient Name. Please
        // proceed to Counter Y." at this rate is a few seconds) -- past
        // this, speechSynthesis.speaking still reading `true` means the
        // queue is jammed, not that it's legitimately still talking.
        const MAX_REALISTIC_UTTERANCE_MS = 8000;

        // 🔥 ADDED: CLOUD VOICE (Amazon Polly, via the "tts-polly" Supabase
        // Edge Function) -- the browser's own speechSynthesis above is
        // device-dependent (some Android/smart-TV browsers ship few or no
        // English voices, so it can silently do nothing). This instead
        // asks a small server-side function to generate real speech audio
        // with Amazon Polly and plays it back through a normal <audio>
        // element, so voice quality is the same on every device. If this
        // ever fails for any reason (offline, AWS hiccup, function not
        // deployed yet), speak() below automatically falls back to the
        // browser voice further up -- voice never goes fully silent just
        // because the cloud call didn't work.
        const ttsAudioEl = new Audio();
        const TTS_FUNCTION_URL = SUPABASE_URL + '/functions/v1/tts-polly';
        const TTS_TIMEOUT_MS = 6000;

        // 🔥 FIX: the missing piece the old "🔎 TEMPORARY" log comment
        // below was still trying to catch -- Amazon Polly itself was
        // never the problem (confirmed from the tts-polly function's own
        // logs: every single call today returned 200 with real MP3 audio,
        // right up to the moment this was reported broken). The failure
        // is downstream of that, in the browser: ttsAudioEl.play() for
        // the FIRST real announcement only ever gets called after the
        // "Queue display ready" test's network round-trip to Polly
        // finishes -- and by the time that response comes back, enough
        // time has passed since the actual tap that some browsers (this
        // is common on embedded/smart-TV-box browsers, less so on a
        // laptop's desktop Chrome) no longer treat play() as connected to
        // a real user gesture, and silently reject it forever after --
        // same root cause the SpeechSynthesis priming call above already
        // works around for the browser-voice fallback, just not yet done
        // for this <audio> element. Fix: play a tiny silent WAV through
        // THIS SAME element SYNCHRONOUSLY inside the tap handler, before
        // any network call happens at all. Once a media element has been
        // successfully played from within a real gesture, browsers keep
        // allowing its play() calls indefinitely afterward -- so every
        // later automatic announcement (called from loadAll()/renderStage(),
        // with no gesture at all) plays normally instead of being silently
        // dropped.
        function unlockTtsAudioElement() {
            try {
                const sampleRate = 8000, numSamples = 400; // ~50ms of silence
                const dataSize = numSamples * 2;
                const buf = new ArrayBuffer(44 + dataSize);
                const view = new DataView(buf);
                const writeStr = (offset, str) => { for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i)); };
                writeStr(0, 'RIFF'); view.setUint32(4, 36 + dataSize, true); writeStr(8, 'WAVE');
                writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
                view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
                writeStr(36, 'data'); view.setUint32(40, dataSize, true); // PCM samples left at 0 = silence

                const unlockUrl = URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }));
                ttsAudioEl.src = unlockUrl;
                // Left to finish on its own (just 50ms of silence) rather
                // than paused from the play() promise -- pausing here could
                // race with the very next real speakCloud() call re-using
                // this same element and cut its announcement off early.
                ttsAudioEl.addEventListener('ended', () => URL.revokeObjectURL(unlockUrl), { once: true });
                const playPromise = ttsAudioEl.play();
                if (playPromise && playPromise.then) {
                    playPromise
                        .then(() => console.log('[voice] audio element unlocked for future automatic play() calls'))
                        .catch(err => { console.warn('[voice] audio element unlock play() was rejected:', err.name, '-', err.message); URL.revokeObjectURL(unlockUrl); });
                }
            } catch (e) {
                console.warn('[voice] could not build/play silent unlock clip (non-fatal):', e);
            }
        }

        function speakCloud(text) {
            return new Promise((resolve, reject) => {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), TTS_TIMEOUT_MS);

                fetch(TTS_FUNCTION_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                        'apikey': SUPABASE_ANON_KEY,
                    },
                    body: JSON.stringify({ text }),
                    signal: controller.signal,
                })
                .then(res => {
                    clearTimeout(timeout);
                    if (!res.ok) throw new Error('tts-polly returned HTTP ' + res.status);
                    return res.blob();
                })
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    ttsAudioEl.onended = () => { URL.revokeObjectURL(url); resolve(); };
                    ttsAudioEl.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Audio playback failed')); };
                    ttsAudioEl.src = url;
                    // 🔎 TEMPORARY: the ONE thing we still can't see -- whether
                    // play() actually succeeds on a REAL automatic call, and
                    // the exact state of the element at that moment (muted?
                    // volume? is the tab even focused/visible?). Confirmed via
                    // Supabase's own function logs that Polly IS being called
                    // and returning real audio for real "Call Next" events --
                    // this narrows down what happens after that.
                    console.log('[voice] about to play -- muted:', ttsAudioEl.muted, 'volume:', ttsAudioEl.volume, 'tab visible:', document.visibilityState, 'tab focused:', document.hasFocus());
                    ttsAudioEl.play()
                        .then(() => console.log('[voice] play() RESOLVED -- should be audible'))
                        .catch(err => { console.log('[voice] play() REJECTED:', err.name, '-', err.message); reject(err); });
                })
                .catch(err => {
                    clearTimeout(timeout);
                    reject(err);
                });
            });
        }

        // The original browser-voice implementation, kept as the fallback
        // path -- unchanged in behavior, just renamed and no longer called
        // directly for real announcements (speak() below decides which to
        // use). Returns true/false so callers can tell whether it actually
        // managed to start talking.
        // 🔥 CHANGED: now returns { started, done } instead of a plain
        // true/false. `started` keeps the old synchronous meaning ("did
        // speech begin") for the one caller that still needs that
        // (the sound-gate's on-screen warning, further down). `done` is
        // new -- a Promise that resolves once the utterance actually
        // finishes (or errors) -- so speak() and the announcement queue
        // below can tell "still talking" apart from "finished", instead
        // of firing the next announcement blind.
        function speakBrowser(text) {
            if (!('speechSynthesis' in window)) return { started: false, done: Promise.resolve() };
            try {
                // 🔥 FIX: if a PREVIOUS utterance got stuck (the same
                // idle-timeout bug above can also leave one utterance
                // wedged mid-queue rather than just going idle-silent),
                // speechSynthesis.speak() below would just queue this new
                // one behind it forever rather than ever playing it. Only
                // force-clear when it's been "speaking" for far longer
                // than any real announcement ever takes -- that's the
                // signal it's actually jammed, not a genuine second
                // announcement still legitimately mid-sentence during
                // back-to-back multi-counter calls (which should be left
                // alone to finish, not cut off).
                if (speechSynthesis.speaking && (Date.now() - lastSpeakStartedAt) > MAX_REALISTIC_UTTERANCE_MS) {
                    speechSynthesis.cancel();
                }
                lastSpeakStartedAt = Date.now();
                const utterance = new SpeechSynthesisUtterance(text);
                const voice = pickVoice();
                if (voice) utterance.voice = voice;
                utterance.rate = 0.95;
                const done = new Promise(resolve => {
                    utterance.onend = () => resolve();
                    utterance.onerror = () => resolve();
                });
                speechSynthesis.speak(utterance);
                return { started: true, done };
            } catch (e) {
                console.warn('Browser voice announcement failed (non-fatal):', e);
                return { started: false, done: Promise.resolve() };
            }
        }

        // Public entry point every announcement in this file calls.
        // Cloud voice first; on any failure, falls back to the browser
        // voice automatically and silently (the gate handler below has
        // its own copy of this logic that reports failures on-screen,
        // since that's the one moment staff are actually watching).
        // 🔥 CHANGED: now returns a Promise that resolves once the
        // announcement has actually finished playing (cloud or browser,
        // whichever path was used) -- see the announcement queue below
        // for why that matters. Never rejects: any failure is already
        // handled/logged internally, same as before.
        function speak(text) {
            if (!voiceEnabled) return Promise.resolve();
            return speakCloud(text).catch(err => {
                console.warn('Cloud voice (Polly) failed, falling back to browser voice:', err);
                return speakBrowser(text).done;
            });
        }

        // ============================================
        // 🔥 FIX: GLOBAL ANNOUNCEMENT QUEUE -- root cause of "two sounds
        // together" / "it jumps to the next name before finishing the
        // first one"
        // ============================================
        // Every cloud-voice announcement plays through the SAME shared
        // <audio> element (ttsAudioEl). Before this fix, each counter's
        // announcement was fired off independently (billing and
        // dispensing render separately in loadAll(), and each only
        // staggered *its own* changed counters by 2.5s -- it had no idea
        // what the other stage, or a different loadAll() tick moments
        // later, was about to do). So two announcements starting close
        // together -- Counter 1 and Counter 2 called within a few
        // seconds of each other, or a billing call and a dispensing call
        // landing in the same update -- both ended up setting `.src` on
        // that ONE shared <audio> element. The second one setting `.src`
        // aborts whatever was still playing, and silently overwrites the
        // first announcement's onended/onerror handlers (they get
        // replaced, never called) -- so the first name just vanishes
        // mid-sentence with no error, while the two audio streams
        // briefly overlap on the way in. That is exactly what was being
        // reported: "two sounds together" and "it left the first one and
        // jumped to the second".
        //
        // Fix: every announcement, from either stage, now goes through
        // ONE shared queue and only starts once the previous one has
        // genuinely finished (or has clearly hung and hit the safety
        // timeout below) -- so at most one voice is ever talking at a
        // time, always in the order the counters were actually called.
        // A stuck item can't jam the display forever: ANNOUNCE_TIMEOUT_MS
        // force-advances the queue if a single announcement never
        // resolves (e.g. a flaky network mid-playback).
        let announceQueue = Promise.resolve();
        const ANNOUNCE_TIMEOUT_MS = 9000;

        function withTimeout(promise, ms) {
            return new Promise(resolve => {
                const timer = setTimeout(resolve, ms);
                promise.then(
                    () => { clearTimeout(timer); resolve(); },
                    () => { clearTimeout(timer); resolve(); }
                );
            });
        }

        function enqueueAnnouncement(text) {
            announceQueue = announceQueue.then(() => withTimeout((async () => {
                try {
                    chime();
                    await new Promise(r => setTimeout(r, 500)); // let the chime finish before speaking
                    await speak(text);
                } catch (e) {
                    console.warn('Announcement failed (non-fatal):', e);
                }
            })(), ANNOUNCE_TIMEOUT_MS)).catch(e => console.warn('Announcement queue error (non-fatal, recovering):', e));
        }

        function updateVoiceToggleIcon() {
            const btn = document.getElementById('voiceToggleBtn');
            if (!btn) return;
            btn.innerHTML = voiceEnabled
                ? '<i class="fa-solid fa-volume-high"></i>'
                : '<i class="fa-solid fa-volume-xmark"></i>';
            btn.style.color = voiceEnabled ? '#475569' : '#dc2626';
        }
        updateVoiceToggleIcon();

        document.getElementById('voiceToggleBtn').addEventListener('click', () => {
            voiceEnabled = !voiceEnabled;
            localStorage.setItem('tvVoiceEnabled', voiceEnabled ? 'true' : 'false');
            updateVoiceToggleIcon();
            if (voiceEnabled) {
                // 🔥 CHANGED: routed through the queue (not a direct
                // speak() call) so a manual toggle-on can't collide with
                // an announcement that's already mid-playback -- same
                // reasoning as the queue itself.
                enqueueAnnouncement('Voice announcements on.');
            } else {
                if ('speechSynthesis' in window) speechSynthesis.cancel();
                ttsAudioEl.pause();
            }
        });

        // ============================================
        // SOUND (blocked until a tap, per browser autoplay rules)
        // ============================================
        let audioCtx = null;
        document.getElementById('soundGateBtn').addEventListener('click', () => {
            let audioFailed = false;
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            } catch (e) {
                console.error('Could not unlock chime audio:', e);
                audioFailed = true;
            }

            // 🔥 FIX: prime the browser's SpeechSynthesis engine with a
            // real call made directly and immediately inside this click
            // handler -- Chrome/Edge only reliably unlock
            // speechSynthesis.speak() when the very first call happens
            // synchronously inside a genuine user gesture like this one.
            // The cloud voice call further down has to wait on a network
            // round-trip to Amazon Polly first, so if the ONLY speech call
            // ever made were the browser-voice fallback inside that later
            // async failure handler, it can silently produce no sound at
            // all even though nothing throws an error -- exactly what was
            // happening here (first tap: nothing; a later, separate click
            // worked fine). Speaking a single space keeps this priming
            // call essentially inaudible while still fully unlocking the
            // engine for every real announcement afterward.
            try {
                if ('speechSynthesis' in window) {
                    speechSynthesis.speak(new SpeechSynthesisUtterance(' '));
                }
            } catch (e) { /* non-fatal */ }

            // 🔥 ADDED: unlock the cloud-voice <audio> element the same
            // way, and just as synchronously -- see unlockTtsAudioElement()
            // above for the full story on why this was the missing piece.
            unlockTtsAudioElement();

            document.getElementById('soundGate').style.display = 'none';
            loadAll();

            function showVoiceWarning(message) {
                // 🔥 FIX: previously, if voice silently failed to unlock,
                // the gate still vanished and the display looked completely
                // normal from then on -- exactly what happened here:
                // "everything is okay but voice is not coming", with no way
                // to tell from the screen itself. This makes that failure
                // visible instead of invisible, right where staff are
                // already looking.
                const warn = document.createElement('div');
                warn.style.cssText = 'position:fixed; top:70px; right:20px; background:#7f1d1d; color:#fecaca; padding:8px 14px; border-radius:8px; font-size:0.8rem; z-index:998; max-width:300px;';
                warn.textContent = message;
                document.body.appendChild(warn);
            }

            if (audioFailed) {
                showVoiceWarning('⚠ Chime could not start on this device/browser.');
            }

            // Test voice end-to-end -- cloud first, browser fallback --
            // and only warn if BOTH genuinely fail. Uses the same two
            // functions speak() uses internally, but (unlike speak())
            // reports the outcome on-screen, since this is the one moment
            // staff are actually watching.
            if (voiceEnabled) {
                speakCloud('Queue display ready.').catch(err => {
                    console.warn('Cloud voice failed on startup, falling back to browser voice:', err);
                    const { started } = speakBrowser('Queue display ready.');
                    if (!started) showVoiceWarning('⚠ Voice could not start on this device/browser.');
                });
            }
        });

        function chime() {
            if (!audioCtx) return;
            try {
                [880, 660].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.25);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.25 + 0.4);
                    osc.connect(gain).connect(audioCtx.destination);
                    osc.start(audioCtx.currentTime + i * 0.25);
                    osc.stop(audioCtx.currentTime + i * 0.25 + 0.4);
                });
            } catch (e) { /* ignore */ }
        }

        // ============================================
        // 🔥 CHANGED: ANIMATED BOARD (people in the queue / at the counters)
        // ============================================
        // Replaces the old "Counter | Patient" tables and the waiting list.
        // Each ticket that is waiting or being served is drawn as a small
        // person: waiting patients stand in the waiting area with their
        // token above them; when a counter calls someone, that person walks
        // to the counter; when billing is finished they walk along the
        // corridor to the dispensing queue; when dispensing is finished they
        // walk off the screen. Everything is driven ONLY by the rows in
        // queue_tickets (same query, same 5s poll + realtime as before) --
        // nothing is stored, and the voice/chime logic below is unchanged.
        //
        // Counter names in the database: billing = 'Counter 1/2/3',
        // dispensing = 'Dispensing 1/2/3'. The old single dispensing counter
        // was called 'Dispatch' -- any ticket still carrying that name today
        // is shown at Dispensing 1.
        const COUNTERS = {
            billing: ['Counter 1', 'Counter 2', 'Counter 3'],
            dispensing: ['Dispensing 1', 'Dispensing 2', 'Dispensing 3']
        };
        function normCounter(stage, name) {
            if (stage === 'dispensing' && name === 'Dispatch') return 'Dispensing 1';
            return name;
        }

        // Board geometry (fixed 1920x1080 board, scaled to the screen)
        const CARD_Y = 120, CARD_H = 396, LANE_Y = 736, QUEUE_FEET_Y = 912, MAX_SLOTS = 7;
        const rootEl = document.getElementById('root');
        const stageEl = document.getElementById('stage');
        const tvEl = document.getElementById('tv');

        function fitBoard() {
            const s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
            tvEl.style.transform = 'scale(' + s + ')';
            tvEl.style.left = ((window.innerWidth - 1920 * s) / 2) + 'px';
            tvEl.style.top = ((window.innerHeight - 1080 * s) / 2) + 'px';
        }
        fitBoard();
        window.addEventListener('resize', fitBoard);

        function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstChild; }
        function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
        const sleep = ms => new Promise(r => setTimeout(r, ms));

        // ---------- people (original simple figures) ----------
        const SKIN = ['#f1c9a5', '#e0a97d', '#c68863', '#a66a48', '#7a4a2f', '#5a3520'];
        const HAIR = ['#1f1a17', '#2b1d14', '#3a2a1e', '#111827', '#4b3621'];
        const SHIRT = ['#e11d48', '#f59e0b', '#8b5cf6', '#0ea5e9', '#14b8a6', '#ef4444', '#f97316', '#84cc16', '#ec4899', '#64748b'];
        const PANTS = ['#334155', '#1e3a5f', '#475569', '#3f3f46', '#27272a'];
        // Same ticket always gets the same-looking person (stable across polls/reloads)
        function seeded(seed) { let a = (seed >>> 0) || 1; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
        function lookFor(seed) {
            const r = seeded(seed * 2654435761);
            const pick = a => a[Math.floor(r() * a.length)];
            return { skin: pick(SKIN), hair: pick(HAIR), shirt: pick(SHIRT), pants: pick(PANTS), female: r() < 0.5 };
        }
        function svgPerson(o) {
            const { skin, hair, shirt, pants, female } = o;
            const legs = female
                ? `<g class="lg legL"><rect x="21" y="88" width="8" height="26" rx="4" fill="${skin}"/><rect x="19" y="110" width="12" height="7" rx="3" fill="#1f2937"/></g>
                   <g class="lg legR"><rect x="31" y="88" width="8" height="26" rx="4" fill="${skin}"/><rect x="29" y="110" width="12" height="7" rx="3" fill="#1f2937"/></g>`
                : `<g class="lg legL"><rect x="20" y="70" width="10" height="44" rx="4" fill="${pants}"/><rect x="18" y="110" width="14" height="7" rx="3" fill="#1f2937"/></g>
                   <g class="lg legR"><rect x="30" y="70" width="10" height="44" rx="4" fill="${pants}"/><rect x="28" y="110" width="14" height="7" rx="3" fill="#1f2937"/></g>`;
            const body = female ? `<path d="M18 40 Q30 34 42 40 L49 94 L11 94 Z" fill="${shirt}"/>` : `<rect x="17" y="38" width="26" height="38" rx="9" fill="${shirt}"/>`;
            const hairBack = female ? `<path d="M16 22 Q16 6 30 6 Q44 6 44 22 L46 48 Q30 54 14 48 Z" fill="${hair}"/>` : '';
            const hairTop = female ? `<path d="M18 20 Q20 8 30 8 Q40 8 42 20 Q30 13 18 20Z" fill="${hair}"/>` : `<path d="M18 21 Q17 7 30 7 Q43 7 42 21 Q30 12 18 21Z" fill="${hair}"/>`;
            return `<svg viewBox="0 0 60 120">${legs}
                <g class="ar armL"><rect x="9" y="40" width="8" height="34" rx="4" fill="${shirt}"/><circle cx="13" cy="76" r="4.5" fill="${skin}"/></g>
                ${hairBack}${body}
                <g class="ar armR"><rect x="43" y="40" width="8" height="34" rx="4" fill="${shirt}"/><circle cx="47" cy="76" r="4.5" fill="${skin}"/></g>
                <rect x="26" y="31" width="8" height="9" fill="${skin}"/>
                <g class="hd"><circle cx="30" cy="22" r="12.5" fill="${skin}"/>${hairTop}
                <circle cx="25.5" cy="23" r="1.7" fill="#1f2937"/><circle cx="34.5" cy="23" r="1.7" fill="#1f2937"/>
                <path d="M25.5 28 Q30 32 34.5 28" stroke="#7c2d12" stroke-width="1.6" fill="none" stroke-linecap="round"/></g></svg>`;
        }

        // ---------- movement ----------
        function place(f, x, y) {
            f.x = x; f.y = y;
            f.el.style.transition = 'opacity .5s';
            f.el.style.transform = `translate(${x - 32}px,${y - 128}px)`;
        }
        function move(f, x, y, speed) {
            speed = speed || 170;
            const dx = x - f.x, dy = y - f.y, d = Math.hypot(dx, dy);
            if (d < 2) return Promise.resolve();
            const dur = Math.max(250, d / speed * 1000), id = (f.mid = (f.mid || 0) + 1);
            f.el.classList.remove('idle'); f.el.classList.add('walk');
            if (Math.abs(dx) > 6) f.flip.style.transform = `scaleX(${dx < 0 ? -1 : 1})`;
            f.el.style.transition = `transform ${dur}ms linear, opacity .5s`;
            f.el.style.transform = `translate(${x - 32}px,${y - 128}px)`;
            f.x = x; f.y = y;
            return sleep(dur).then(() => { if (f.mid === id) { f.el.classList.remove('walk'); f.flip.style.transform = ''; f.el.classList.add('idle'); } });
        }
        // Walk through waypoints; a newer route for the same person cancels this one.
        async function route(f, pts, speed) {
            const id = (f.rid = (f.rid || 0) + 1);
            for (const p of pts) {
                if (f.rid !== id) return false;
                await move(f, p[0], p[1], speed);
            }
            return f.rid === id;
        }

        // ---------- the two sides of the board ----------
        const clerkCoat = { billing: '#1e3a8a', dispensing: '#f8fafc' };
        const sides = {};
        [
            { key: 'billing', title: 'BILLING', plate: 'Billing', x0: 36, cls: 'b' },
            { key: 'dispensing', title: 'DISPENSING', plate: 'Dispensing', x0: 972, cls: 'g' }
        ].forEach(cfg => {
            const wrap = el(`<div class="abs ${cfg.cls}" style="left:${cfg.x0}px;top:90px;width:912px;height:900px"></div>`);
            rootEl.appendChild(wrap);
            const add = (html, y) => { const e = el(html); e.style.top = y + 'px'; e.style.left = '0'; wrap.appendChild(e); return e; };
            const banner = add(`<div class="abs banner"><h1>${cfg.title}</h1><p>(3 Counters)</p><div class="bl"><span class="n">0</span><span class="t">waiting</span></div><div class="br"><span class="nx"><span>UP NEXT</span><b>&mdash;</b></span></div></div>`, 0);
            const cards = [];
            for (let i = 0; i < 3; i++) {
                const clerk = svgPerson({ skin: SKIN[(i * 2 + (cfg.key === 'billing' ? 1 : 3)) % SKIN.length], hair: HAIR[(i + 1) % HAIR.length], shirt: clerkCoat[cfg.key], pants: '#334155', female: i !== 1 });
                const c = el(`<div class="cc idle" style="left:${i * 312}px;top:${CARD_Y}px">
                    <div class="plate"><span class="circle">${i + 1}</span>${cfg.plate}</div>
                    <div class="art"><div class="clerk">${clerk}</div><div class="monitor"><i></i></div><div class="desk"></div></div>
                    <div class="zone"><div class="info"><div class="lab"></div><div class="tok">&mdash;</div><div class="pn">Free &ndash; waiting for next patient</div></div></div></div>`);
                wrap.appendChild(c); cards.push(c);
            }
            const qz = add(`<div class="abs qz"><div class="floor"></div><div class="empty">No one waiting</div><div class="more" style="display:none"></div></div>`, 650);
            add(`<div class="abs pill"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="8" r="4"/><path d="M14 14l2 10h10l4 8M16 24l-4 8M22 17h5"/></svg>Please sit in the ${cfg.key} queue until your number is called.</div>`, 852);
            sides[cfg.key] = { cfg, banner, cards, qz, cardTicket: [null, null, null] };
        });

        function slotPos(stage, k) { return { x: sides[stage].cfg.x0 + 80 + Math.min(k, MAX_SLOTS - 1) * 118, y: QUEUE_FEET_Y }; }
        function spotPos(stage, i) { return { x: sides[stage].cfg.x0 + i * 312 + 62, y: 90 + CARD_Y + CARD_H - 28 }; }

        function setCard(stage, i, state, t) {
            const c = sides[stage].cards[i];
            c.classList.remove('idle', 'called', 'serving'); c.classList.add(state);
            c.querySelector('.lab').textContent = state === 'called' ? 'Please proceed' : state === 'serving' ? 'Now serving' : '';
            c.querySelector('.tok').innerHTML = t ? '#' + esc(t.token_number) : '&mdash;';
            c.querySelector('.pn').textContent = t ? (t.patient_name || '') : 'Free – waiting for next patient';
        }

        // ---------- people on the board, keyed by ticket id ----------
        const figs = new Map();
        function makeFig(t, stage) {
            const e = el(`<div class="fig ${stage === 'billing' ? 'b' : 'g'} idle" style="--d:${(seeded(t.id * 7 + 1)() * 3).toFixed(1)}s"><div class="flip">${svgPerson(lookFor(Number(t.id) || Number(t.token_number) || 1))}</div><div class="shadow"></div><div class="tag"></div><div class="nm"></div></div>`);
            stageEl.appendChild(e);
            return { el: e, flip: e.querySelector('.flip'), tag: e.querySelector('.tag'), nm: e.querySelector('.nm'), x: 0, y: 0, state: null, id: t.id };
        }
        function styleFig(f, t, stage, kind, idx) {
            f.el.classList.toggle('b', stage === 'billing');
            f.el.classList.toggle('g', stage !== 'billing');
            f.el.classList.toggle('serve', kind === 'serve');
            f.el.classList.toggle('hidetag', kind === 'serve');
            f.tag.textContent = '#' + t.token_number;
            f.tag.classList.toggle('pri', !!t.priority);
            f.tag.classList.toggle('next', kind === 'wait' && idx === 0);
            f.nm.textContent = (t.patient_name || '').split(' ')[0];
            const hidden = kind === 'wait' && idx >= MAX_SLOTS;
            f.el.style.opacity = hidden ? 0 : 1;
        }
        function exitFig(f, prev) {
            // Leaves along the corridor: finished dispensing -> right edge; anything else drops out toward its own side
            f.el.classList.remove('serve'); f.el.classList.add('hidetag');
            const toRight = !prev || prev.stage === 'dispensing';
            const endX = toRight ? 2000 : -100;
            route(f, [[f.x, LANE_Y], [endX, LANE_Y]], 170).then(ok => { if (ok) f.el.remove(); });
            // safety net: never leave an orphan on screen
            setTimeout(() => { if (f.el.parentNode && f.dead) f.el.remove(); }, 20000);
            f.dead = true;
        }

        let firstPaint = true;
        let lastServingByCounter = {};

        function paintStageHeader(stage, waitingRows) {
            const s = sides[stage];
            s.banner.querySelector('.bl .n').textContent = waitingRows.length;
            s.banner.querySelector('.br .nx b').innerHTML = waitingRows.length ? '#' + esc(waitingRows[0].token_number) : '&mdash;';
            s.qz.querySelector('.empty').style.display = waitingRows.length ? 'none' : '';
            const more = s.qz.querySelector('.more');
            more.style.display = waitingRows.length > MAX_SLOTS ? '' : 'none';
            more.textContent = '+ ' + (waitingRows.length - MAX_SLOTS) + ' more';
        }

        function renderBoard(billingServing, billingWaiting, dispensingServing, dispensingWaiting) {
            const changedCounters = [];
            const desired = new Map(); // ticket id -> { t, stage, kind, idx }

            [['billing', billingServing, billingWaiting], ['dispensing', dispensingServing, dispensingWaiting]].forEach(([stage, serving, waiting]) => {
                const field = stage === 'billing' ? 'billing_counter' : 'dispensing_counter';
                const names = COUNTERS[stage];
                const taken = new Set();
                const placed = [];
                serving.forEach(t => {
                    let i = names.indexOf(normCounter(stage, t[field]));
                    if (i < 0 || taken.has(i)) i = -1;
                    placed.push({ t, i });
                    if (i >= 0) taken.add(i);
                });
                // a serving ticket whose counter name isn't one of ours still gets shown, at the first free card
                placed.forEach(p => { if (p.i < 0) { for (let k = 0; k < names.length; k++) if (!taken.has(k)) { p.i = k; taken.add(k); break; } } });
                placed.forEach(p => { if (p.i >= 0) desired.set(p.t.id, { t: p.t, stage, kind: 'serve', idx: p.i }); });
                waiting.forEach((t, k) => desired.set(t.id, { t, stage, kind: 'wait', idx: k }));
                paintStageHeader(stage, waiting);

                // counter cards + announcements
                names.forEach((counterName, i) => {
                    const p = placed.find(x => x.i === i);
                    const ticket = p ? p.t : null;
                    const side = sides[stage];
                    const key = stage + ':' + counterName;
                    if (ticket) {
                        if ((key in lastServingByCounter) && lastServingByCounter[key] !== ticket.id) {
                            changedCounters.push({ counterName, ticket });
                        }
                        lastServingByCounter[key] = ticket.id;
                        if (side.cardTicket[i] !== ticket.id) {
                            side.cardTicket[i] = ticket.id;
                            // first paint / page load: show as already serving; a new call: highlight until they arrive
                            setCard(stage, i, firstPaint ? 'serving' : 'called', ticket);
                        } else {
                            const c = side.cards[i];
                            c.querySelector('.pn').textContent = ticket.patient_name || '';
                        }
                    } else {
                        // 🔥 FIX: a counter that is idle when the page loads has never been "seen" serving anyone, so the
                        // FIRST patient called there after that was treated like page-load state and never announced.
                        // Marking it as seen (with no ticket) on the first paint means that first call IS announced.
                        if (firstPaint && !(key in lastServingByCounter)) lastServingByCounter[key] = null;
                        if (side.cardTicket[i] !== null) {
                            side.cardTicket[i] = null;
                            setCard(stage, i, 'idle', null);
                        }
                    }
                    // (no `delete lastServingByCounter[key]` on idle -- see the earlier FIX note: the next call after an idle gap must still be announced)
                });
            });

            // people who are no longer waiting/being served leave the screen
            figs.forEach((f, id) => { if (!desired.has(id)) { figs.delete(id); exitFig(f, f.state); } });

            // everyone else: create / move
            desired.forEach((d, id) => {
                let f = figs.get(id);
                const target = d.kind === 'serve' ? spotPos(d.stage, d.idx) : slotPos(d.stage, d.idx);
                const prev = f ? f.state : null;
                const isNew = !f;
                if (isNew) { f = makeFig(d.t, d.stage); figs.set(id, f); }
                styleFig(f, d.t, d.stage, d.kind, d.idx);
                f.state = { stage: d.stage, kind: d.kind, idx: d.idx };

                if (isNew) {
                    if (firstPaint) { place(f, target.x, target.y); }
                    else if (d.kind === 'wait' && d.stage === 'billing') {
                        // new patient walks in from the door and joins the end of the queue
                        place(f, target.x + 40, target.y + 60); f.el.style.opacity = 0;
                        setTimeout(() => { styleFig(f, d.t, d.stage, d.kind, d.idx); route(f, [[target.x, target.y]], 130); }, 30);
                    } else if (d.kind === 'wait') {
                        place(f, target.x, LANE_Y); f.el.style.opacity = 0;
                        setTimeout(() => { styleFig(f, d.t, d.stage, d.kind, d.idx); route(f, [[target.x, target.y]], 140); }, 30);
                    } else {
                        // called while this screen wasn't watching their queue: start from the front of the queue
                        const s0 = slotPos(d.stage, 0); place(f, s0.x, s0.y);
                        setTimeout(() => walkToCounter(f, d, target), 30);
                    }
                    return;
                }

                const moved = Math.abs(f.x - target.x) > 1 || Math.abs(f.y - target.y) > 1;
                if (!moved) return;
                if (d.kind === 'serve') {
                    walkToCounter(f, d, target);
                } else if (prev && prev.kind === 'serve') {
                    // finished at billing (or sent back): out through the corridor to the right queue
                    route(f, [[f.x, LANE_Y], [target.x, LANE_Y], [target.x, target.y]], 170);
                } else {
                    route(f, [[target.x, target.y]], 150);
                }
            });
            firstPaint = false;

            changedCounters.forEach(c => {
                enqueueAnnouncement(`Token number ${c.ticket.token_number}. ${c.ticket.patient_name}. Please proceed to ${c.counterName}.`);
            });
        }

        function walkToCounter(f, d, target) {
            route(f, [[target.x, target.y]], 190).then(ok => {
                if (!ok) return;
                const side = sides[d.stage];
                if (side.cardTicket[d.idx] === d.t.id) setCard(d.stage, d.idx, 'serving', d.t);
            });
        }

        // ============================================
        // LOAD + RENDER BOTH COLUMNS
        // ============================================
        let loadSeq = 0, appliedSeq = 0;
        async function loadAll() {
            const mySeq = ++loadSeq;
            const today = new Date().toISOString().split('T')[0];
            const { data, error } = await supabaseClient
                .from('queue_tickets')
                .select('id, token_number, patient_name, status, priority, billing_counter, dispensing_counter, called_billing_at, called_dispensing_at, completed_at, created_at')
                .eq('queue_date', today)
                .order('token_number', { ascending: true });

            if (error) {
                console.error('Error loading queue for TV display:', error);
                return;
            }
            // two loads can overlap (realtime burst + poll): never let an older answer overwrite a newer one
            if (mySeq < appliedSeq) return;
            appliedSeq = mySeq;

            const rows = data || [];
            // priority tickets are called first (see call_next_ticket()), so the on-screen waiting order matches who is really next
            const byPriority = (a, b) => (b.priority ? 1 : 0) - (a.priority ? 1 : 0);
            const billingServing = rows.filter(r => r.status === 'serving_billing');
            const billingWaiting = rows.filter(r => r.status === 'waiting_billing').sort(byPriority);
            const dispensingServing = rows.filter(r => r.status === 'serving_dispensing');
            const dispensingWaiting = rows.filter(r => r.status === 'waiting_dispensing').sort(byPriority);

            try {
                renderBoard(billingServing, billingWaiting, dispensingServing, dispensingWaiting);
            } catch (e) {
                console.error('TV board render failed (non-fatal, will retry on next update):', e);
            }
        }

        // ============================================
        // LIVE UPDATES: realtime + polling fallback
        // ============================================
        try {
            supabaseClient
                .channel('queue_tickets_tv_' + Date.now())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'queue_tickets' }, () => loadAll())
                .subscribe();
        } catch (e) {
            console.warn('Realtime subscription failed, falling back to polling only:', e);
        }
        setInterval(loadAll, 5000);

        // ============================================
        // 🔥 ADDED: DAILY SELF-REFRESH
        // ============================================
        // This page is meant to stay open on a TV indefinitely -- days
        // or weeks at a stretch. Data freshness is already handled above
        // (realtime + a 5s poll), so this isn't about that; it's plain
        // browser hygiene for a tab that never closes: a full reload
        // once a day clears out any slow memory growth or a realtime
        // socket that's quietly gone stale, before either becomes
        // visible as a problem.
        //
        // Scheduled for a fixed, configurable off-hours time rather than
        // "every N hours from whenever it happened to load", so it never
        // lands in the middle of a busy afternoon. Change
        // DAILY_RELOAD_HOUR below if 3 AM isn't a quiet time here.
        //
        // Trade-off worth knowing: this reload also resets the sound
        // gate (browsers re-block audio/speech after any full page
        // load), so voice goes silent until someone taps the screen
        // again -- normally a non-issue since it lands hours before
        // opening and whoever arrives first taps it same as any other
        // morning. The visual board itself is never affected either way.
        // ============================================
        const DAILY_RELOAD_HOUR = 3; // 24h clock, local time to this device
        (function scheduleDailyReload() {
            const now = new Date();
            const next = new Date(now);
            next.setHours(DAILY_RELOAD_HOUR, 0, 0, 0);
            if (next <= now) next.setDate(next.getDate() + 1);
            setTimeout(() => location.reload(), next - now);
        })();
    })();
    </script>
