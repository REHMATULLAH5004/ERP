<div id="retailPosContainer">
    <!-- Top Bar - Compact -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 8px 15px; background: white; border-radius: 8px; border: 1px solid #e2e8f0; flex-wrap: wrap; gap: 5px;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <button id="toggleSidebarBtn" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; color: #475569; padding: 3px;">
                <i class="fa-solid fa-bars"></i>
            </button>
            <span style="font-weight: 600; color: #0f172a; font-size: 0.9rem;">Retail POS</span>
            <span id="saleIdDisplay" style="font-weight: bold; color: #0f172a; font-size: 0.85rem; background: #f1f5f9; padding: 2px 10px; border-radius: 4px;">GRI-2026-0001</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
            <span style="font-size: 0.75rem; color: #64748b;">
                <kbd style="background: #e2e8f0; padding: 1px 6px; border-radius: 3px; font-size: 0.7rem;">Ctrl+S</kbd> Save
            </span>
            <span style="font-size: 0.75rem; color: #64748b;">
                <kbd style="background: #e2e8f0; padding: 1px 6px; border-radius: 3px; font-size: 0.7rem;">Ctrl+Q</kbd> Quote
            </span>
            <span style="font-size: 0.75rem; color: #64748b;">
                <kbd style="background: #e2e8f0; padding: 1px 6px; border-radius: 3px; font-size: 0.7rem;">Ctrl+R</kbd> Reset
            </span>
            <button id="toggleHistoryBtn" style="background: #f1f5f9; border: 1px solid #e2e8f0; padding: 4px 12px; border-radius: 4px; cursor: pointer; color: #475569; font-size: 0.75rem; display: flex; align-items: center; gap: 4px;">
                <i class="fa-solid fa-clock-rotate-left"></i>
                <span>History</span>
                <i id="historyToggleIcon" class="fa-solid fa-chevron-down" style="font-size: 0.6rem;"></i>
            </button>
        </div>
    </div>

    <!-- Main Content: Two Columns - Form + Compact -->
    <div style="display: flex; gap: 15px;">
        <!-- Left: Sale Form -->
        <div style="flex: 2; min-width: 0;">
            <div class="card" style="padding: 12px;">
                
                <!-- Invoice Header - Compact 3 columns -->
                <div style="display: grid; grid-template-columns: 1.2fr 1fr 0.8fr; gap: 12px; margin-bottom: 10px; background: #f8fafc; padding: 8px 12px; border-radius: 4px; border: 1px solid #e2e8f0;">
                    <div>
                        <label style="display: block; font-weight: 500; color: #475569; margin-bottom: 2px; font-size: 0.75rem;">Invoice #</label>
                        <input type="text" id="invoiceNumber" readonly style="width: 100%; padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 4px; background: #f1f5f9; font-weight: 600; color: #0f172a; font-size: 0.85rem;">
                    </div>
                    <div>
                        <label style="display: block; font-weight: 500; color: #475569; margin-bottom: 2px; font-size: 0.75rem;">Date & Time</label>
                        <input type="text" id="invoiceDateTime" readonly style="width: 100%; padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 4px; background: #f1f5f9; font-size: 0.8rem;">
                    </div>
                    <div>
                        <label style="display: block; font-weight: 500; color: #475569; margin-bottom: 2px; font-size: 0.75rem;">Payment</label>
                        <select id="retailPaymentType" style="width: 100%; padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 4px; background: white; font-size: 0.8rem;">
                            <option value="Credit">Credit</option>
                            <option value="Cash">Cash</option>
                            <option value="Airtel Money">Airtel Money</option>
                            <option value="Bank Transfer">Bank Transfer</option>
                        </select>
                    </div>
                </div>

                <!-- Client Type Selector - Compact -->
                <div style="display: flex; gap: 10px; margin-bottom: 8px; align-items: center; flex-wrap: wrap;">
                    <div style="display: flex; gap: 4px; background: #f1f5f9; padding: 3px; border-radius: 4px;">
                        <button class="retail-client-btn active" data-type="NHIMA" style="padding: 4px 14px; border: none; border-radius: 4px; cursor: pointer; background: #2563eb; color: white; font-weight: 500; font-size: 0.75rem;">NHIMA</button>
                        <button class="retail-client-btn" data-type="REGULAR" style="padding: 4px 14px; border: none; border-radius: 4px; cursor: pointer; background: transparent; color: #475569; font-size: 0.75rem;">Regular</button>
                        <button class="retail-client-btn" data-type="ONLINE" style="padding: 4px 14px; border: none; border-radius: 4px; cursor: pointer; background: transparent; color: #475569; font-size: 0.75rem;">Online</button>
                        <button class="retail-client-btn" data-type="STAFF" style="padding: 4px 14px; border: none; border-radius: 4px; cursor: pointer; background: transparent; color: #475569; font-size: 0.75rem;">Staff</button>
                    </div>
                </div>

                <!-- Payment Note Box - Compact -->
                <div id="retailPaymentNoteBox" style="display: none; border: 1px solid #f59e0b; padding: 6px 10px; border-radius: 4px; margin-bottom: 8px; background: #fffbeb;">
                    <label style="display: block; font-weight: 500; color: #475569; margin-bottom: 2px; font-size: 0.7rem;">Reference / Note</label>
                    <input type="text" id="retailPaymentNote" placeholder="e.g. Airtel Ref #12345" style="width: 100%; padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 4px; background: white; font-size: 0.8rem;">
                </div>

                <!-- Customer Details - Compact -->
                <div id="retailCustomerDetails" style="border: 1px solid #e2e8f0; padding: 8px 12px; border-radius: 4px; margin-bottom: 8px; background: #f8fafc;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
                        <span style="font-weight: 500; color: #0f172a; font-size: 0.8rem;">Customer Details</span>
                        <span id="historyBadge" style="display: none; background: #2563eb; color: white; padding: 1px 8px; border-radius: 10px; font-size: 0.6rem;">
                            <i class="fa-solid fa-circle" style="font-size: 0.4rem;"></i> History
                        </span>
                    </div>
                    
                    <div id="retailNhimaFields">
                        <!-- NHIMA Number & NRC -->
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                            <div>
                                <label style="display: block; font-weight: 500; color: #475569; margin-bottom: 2px; font-size: 0.7rem;">NHIMA Number</label>
                                <div style="display: flex; gap: 4px;">
                                    <select id="retailNhimaNumber" style="flex: 1; padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 4px; background: white; font-size: 0.8rem;">
                                        <option value="">Select NHIMA</option>
                                    </select>
                                    <button id="addNhimaBtn" style="background: #2563eb; color: white; border: none; padding: 0 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">+</button>
                                </div>
                            </div>
                            <div>
                                <label style="display: block; font-weight: 500; color: #475569; margin-bottom: 2px; font-size: 0.7rem;">NRC</label>
                                <input type="text" id="retailNrc" placeholder="NRC" style="width: 100%; padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 4px; background: white; font-size: 0.8rem;">
                            </div>
                        </div>
                    
                        <!-- NEW ROW: Claim Number (Mandatory for NHIMA) -->
                        <div style="margin-top: 6px;">
                            <label style="display: block; font-weight: 500; color: #475569; margin-bottom: 2px; font-size: 0.7rem;">
                                Claim Number <span style="color: #dc2626;">*</span>
                            </label>
                            <input type="text" id="retailClaimNumber" required placeholder="e.g. NHIMA-CLAIM-2026-001" style="width: 100%; padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 4px; background: white; font-size: 0.8rem;">
                        </div>
                    
                        <!-- Name, Phone, Address -->
                        <div style="display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 8px; margin-top: 6px;">
                            <div>
                                <label style="display: block; font-weight: 500; color: #475569; margin-bottom: 2px; font-size: 0.7rem;">Full Name</label>
                                <input type="text" id="retailCustomerName" style="width: 100%; padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 4px; background: white; font-size: 0.8rem;">
                            </div>
                            <div>
                                <label style="display: block; font-weight: 500; color: #475569; margin-bottom: 2px; font-size: 0.7rem;">Phone</label>
                                <input type="text" id="retailPhoneNumber" style="width: 100%; padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 4px; background: white; font-size: 0.8rem;">
                            </div>
                            <div>
                                <label style="display: block; font-weight: 500; color: #475569; margin-bottom: 2px; font-size: 0.7rem;">Address</label>
                                <input type="text" id="retailAddress" style="width: 100%; padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 4px; background: white; font-size: 0.8rem;">
                            </div>
                        </div>
                    </div>

                    <!-- Regular/Online/Staff Fields - Compact -->
                    <div id="retailRegularFields" style="display: none;">
                        <div style="display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 8px;">
                            <div>
                                <label style="display: block; font-weight: 500; color: #475569; margin-bottom: 2px; font-size: 0.7rem;">Full Name</label>
                                <input type="text" id="retailRegName" style="width: 100%; padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 4px; background: white; font-size: 0.8rem;">
                            </div>
                            <div>
                                <label style="display: block; font-weight: 500; color: #475569; margin-bottom: 2px; font-size: 0.7rem;">Phone</label>
                                <div style="display: flex; gap: 4px;">
                                    <select id="retailRegPhone" style="flex: 1; padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 4px; background: white; font-size: 0.8rem;">
                                        <option value="">Select Phone</option>
                                    </select>
                                    <button id="addPhoneBtn" style="background: #2563eb; color: white; border: none; padding: 0 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">+</button>
                                </div>
                            </div>
                            <div>
                                <label style="display: block; font-weight: 500; color: #475569; margin-bottom: 2px; font-size: 0.7rem;">Address</label>
                                <input type="text" id="retailRegAddress" style="width: 100%; padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 4px; background: white; font-size: 0.8rem;">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Item Table - With Delete Button First -->
                <div style="border: 1px solid #e2e8f0; border-radius: 4px; overflow-x: auto;">
                    <table class="table-minimal" id="retailPosTable" style="min-width: 1000px; width: 100%; font-size: 0.8rem;">
                        <thead style="background: #f1f5f9;">
                            <tr>
                                <th style="padding: 4px 6px; text-align: center; width: 4%;">✕</th>
                                <th style="padding: 4px 6px; text-align: left; width: 17%;">Item Name</th>
                                <th style="padding: 4px 6px; text-align: left; width: 13%;">Batch</th>
                                <th style="padding: 4px 6px; text-align: center; width: 7%;">Pack</th>
                                <th style="padding: 4px 6px; text-align: center; width: 5%;">Tax %</th>
                                <th style="padding: 4px 6px; text-align: right; width: 10%;">Rate</th>
                                <th style="padding: 4px 6px; text-align: center; width: 6%;">Qty</th>
                                <th style="padding: 4px 6px; text-align: right; width: 10%;">Total</th>
                                <th style="padding: 4px 6px; text-align: center; width: 7%;">Days</th>
                                <!-- 🔥 ADDED: How to Take -->
                                <th style="padding: 4px 6px; text-align: left; width: 21%;">How to Take</th>
                            </tr>
                        </thead>
                        <tbody id="retailPosTableBody">
                            <tr class="retail-pos-row">
                                <td style="padding: 2px 4px; text-align: center;">
                                    <button class="retail-remove-btn" style="background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.9rem;">
                                        <i class="fa-regular fa-trash-can"></i>
                                    </button>
                                </td>
                                <td style="padding: 2px 4px;">
                                    <select class="retail-pos-item" style="width: 100%; padding: 3px 6px; border: 1px solid #e2e8f0; border-radius: 3px; background: white; font-size: 0.8rem;">
                                        <option value="">Select Item</option>
                                    </select>
                                </td>
                                <td style="padding: 2px 4px;">
                                    <select class="retail-pos-batch" style="width: 100%; padding: 3px 6px; border: 1px solid #e2e8f0; border-radius: 3px; background: white; font-size: 0.8rem;">
                                        <option value="">Select Batch</option>
                                    </select>
                                </td>
                                <td style="padding: 2px 4px;">
                                    <input type="text" class="retail-pos-pack-size" readonly style="width: 100%; padding: 3px 6px; border: 1px solid #e2e8f0; border-radius: 3px; background: #f1f5f9; color: #64748b; text-align: center; font-size: 0.8rem;">
                                </td>
                                <td style="padding: 2px 4px;">
                                    <input type="number" class="retail-pos-tax" readonly style="width: 100%; padding: 3px 6px; border: 1px solid #e2e8f0; border-radius: 3px; background: #f1f5f9; color: #64748b; text-align: center; font-size: 0.8rem;">
                                </td>
                                <td style="padding: 2px 4px;">
                                    <input type="number" class="retail-pos-rate" step="0.01" readonly style="width: 100%; padding: 3px 6px; border: 1px solid #e2e8f0; border-radius: 3px; background: #f1f5f9; color: #64748b; text-align: right; font-size: 0.8rem;">
                                </td>
                                <td style="padding: 2px 4px;">
                                    <input type="number" class="retail-pos-qty" min="1" value="1" style="width: 100%; padding: 3px 6px; border: 1px solid #e2e8f0; border-radius: 3px; background: white; text-align: center; font-size: 0.8rem;">
                                </td>
                                <td style="padding: 2px 4px;">
                                    <input type="text" class="retail-pos-total" readonly style="width: 100%; padding: 3px 6px; border: 1px solid #e2e8f0; border-radius: 3px; background: #f1f5f9; color: #64748b; text-align: right; font-size: 0.8rem;">
                                </td>
                                <td style="padding: 2px 4px;">
                                    <input type="number" class="retail-pos-days" min="0" value="0" style="width: 100%; padding: 3px 6px; border: 1px solid #e2e8f0; border-radius: 3px; background: white; text-align: center; font-size: 0.8rem;">
                                </td>
                                <!-- 🔥 ADDED: How to Take -->
                                <td style="padding: 2px 4px;">
                                    <input type="text" class="retail-pos-how-to-take" placeholder="e.g. 1 tab twice daily after meals" style="width: 100%; padding: 3px 6px; border: 1px solid #e2e8f0; border-radius: 3px; background: white; font-size: 0.8rem;">
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Totals Section - Compact -->
                <div style="margin-top: 8px; padding: 8px 15px; background: #f8fafc; border-radius: 4px; border: 1px solid #e2e8f0;">
                    <div style="display: flex; justify-content: flex-end; gap: 25px; font-size: 0.85rem; flex-wrap: wrap;">
                        <div style="text-align: right;">
                            <span style="color: #64748b;">Subtotal:</span>
                            <span id="retailSubtotal" style="font-weight: 500; margin-left: 10px;">K0.00</span>
                        </div>
                        <div style="text-align: right;">
                            <span style="color: #64748b;">Tax:</span>
                            <span id="retailTotalTax" style="font-weight: 500; margin-left: 10px;">K0.00</span>
                        </div>
                        <div style="text-align: right;">
                            <span style="color: #0f172a; font-weight: 600;">Total:</span>
                            <span id="retailGrandTotal" style="font-size: 1.1rem; font-weight: bold; margin-left: 10px; color: #0f172a;">K0.00</span>
                        </div>
                    </div>
                </div>

                <!-- Buttons - Compact -->
                <div style="margin-top: 8px; display: flex; gap: 8px; justify-content: flex-end; border-top: 1px solid #e2e8f0; padding-top: 8px; flex-wrap: wrap;">
                    <button id="searchSalesBtn" style="background: white; border: 1px solid #2563eb; color: #2563eb; padding: 6px 18px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">
                        <i class="fa-solid fa-magnifying-glass"></i> Search
                    </button>
                    <button id="makeQuotationBtn" style="background: #f59e0b; color: white; border: none; padding: 6px 18px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">
                        <i class="fa-solid fa-file-lines"></i> <span class="btn-label">Quotation</span>
                    </button>
                    <button id="saveTransactionBtn" style="background: #10b981; color: white; border: none; padding: 6px 18px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">
                        <i class="fa-solid fa-floppy-disk"></i> <span class="btn-label">Save</span>
                    </button>
                    <button id="clearSaleBtn" style="background: #f1f5f9; border: 1px solid #e2e8f0; padding: 6px 18px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">
                        <i class="fa-solid fa-rotate-right"></i> Reset
                    </button>
                </div>
            </div>
        </div>

        <!-- Right: Empty for now - History will be at bottom -->
        <div style="flex: 0; min-width: 0; display: none;"></div>
    </div>

    <!-- Client History - At Bottom (Collapsible) -->
    <div id="clientHistoryContainer" style="display: none; margin-top: 10px; border: 1px solid #e2e8f0; border-radius: 6px; overflow: hidden;">
        <div style="padding: 6px 15px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 500; color: #0f172a; font-size: 0.85rem;">
                <i class="fa-solid fa-clock-rotate-left" style="color: #2563eb;"></i> Client History
            </span>
            <button id="viewAllHistoryBtn" style="background: none; border: none; color: #2563eb; cursor: pointer; font-size: 0.8rem;">
                View All <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
        <div id="clientHistoryContent" style="padding: 8px 15px; max-height: 200px; overflow-y: auto; background: white;">
            <div style="text-align: center; padding: 15px 10px; color: #64748b; font-size: 0.85rem;">
                <i class="fa-solid fa-user" style="font-size: 1.2rem; display: block; margin-bottom: 5px; opacity: 0.3;"></i>
                <p>Select a client to view history</p>
            </div>
        </div>
    </div>
</div>
