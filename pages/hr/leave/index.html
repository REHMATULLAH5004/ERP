<div class="module-view-container">
    <h3 style="margin: 0 0 20px 0;">Annual Leave Balances</h3>
    <p style="color:#64748b; font-size:0.85rem; margin-top:-15px; margin-bottom:20px;">
        Calendar year (Jan 1 -- Dec 31). Leave requests are submitted and approved elsewhere (Dashboard / HR Overview) -- this page is just a summary.
    </p>

    <div class="card" style="padding: 0;">
        <table class="table-minimal" id="leaveTable">
            <thead>
                <tr>
                    <th style="padding-left: 20px;">Employee</th>
                    <th style="text-align: right;">Annual Leave</th>
                    <th style="text-align: right;">Leave Taken</th>
                    <th style="padding-right: 20px; text-align: right;">Remaining</th>
                </tr>
            </thead>
            <tbody id="leaveTableBody">
                <tr>
                    <td colspan="4" style="text-align: center; padding: 30px; color: #94a3b8;">
                        <i class="fa-solid fa-spinner fa-spin"></i> Loading leave balances...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- LEAVE TAKEN DRILL-DOWN -->
<div id="leaveTakenModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; padding: 25px; border-radius: 12px; width: 90%; max-width: 420px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #e2e8f0; padding-bottom: 12px;">
            <h4 id="leaveTakenTitle" style="margin: 0;"><i class="fa-solid fa-calendar-days" style="color: #2563eb;"></i> Leave Taken</h4>
            <button onclick="document.getElementById('leaveTakenModal').style.display='none'" style="background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #94a3b8;">&times;</button>
        </div>
        <div id="leaveTakenList"></div>
    </div>
</div>

<script>
    document.dispatchEvent(new Event('loadModuleComplete'));
</script>
