<div class="sidebar-module-title"><i class="fa-solid fa-address-card"></i> CRM</div>
<p class="helper-text" style="padding: 0 20px; font-size: 0.8rem;">
    Search any patient's NHIMA sale history by NHIMA number or name --
    independent of registering a patient in the main panel.
</p>

<!-- 🔥 MOVED HERE FROM THE MAIN CRM PAGE: PATIENT SALES LOOKUP -->
<!-- This used to be a card at the top of crm-view.html, but it has
     nothing to do with the registration form there -- it's a general
     "check any patient, registered today or not" tool, so it lives
     here in the sidebar instead, always available no matter what's
     happening in the main panel. This file's own markup is static (a
     <script> tag here would never execute -- see the note in
     dashboard-menu.html); crm-view.js wires the search box/button and
     writes results/history into these placeholder IDs. -->
<div style="padding: 0 20px; margin-top: 16px;">
    <div style="font-size:0.7rem; font-weight:700; color:#94a3b8; letter-spacing:0.5px; text-transform:uppercase; margin-bottom:8px;">
        <i class="fa-solid fa-magnifying-glass"></i> Patient Sales Lookup
    </div>
    <input type="text" id="crmSidebarLookupSearch" class="form-control" placeholder="NHIMA number or name..." autocomplete="off" style="font-size:0.8rem; padding:7px 9px;">
    <button id="crmSidebarLookupBtn" class="btn btn-primary btn-sm" style="width:100%; margin-top:8px; justify-content:center;">
        <i class="fa-solid fa-magnifying-glass"></i> Search
    </button>
    <div id="crmSidebarLookupResults" style="margin-top:10px;"></div>
</div>

<!-- Shown once a search result is clicked -- that patient's sale
     history (last 5, with a "View Full History" option), same table
     layout the registration page's Patient History card uses, just
     narrower. Populated by loadPatientHistoryInto() in crm-view.js. -->
<div id="crmSidebarLookupHistoryWrap" style="padding: 0 20px; margin-top: 18px; display:none;">
    <div style="border-top:1px solid #e8edf3; padding-top:14px;">
        <div id="crmSidebarLookupName" style="font-weight:700; font-size:0.85rem; color:#0f172a; margin-bottom:6px;"></div>
        <div id="crmSidebarLookupBanner" style="display:none; margin-bottom:10px; padding:8px 10px; border-radius:6px; font-size:0.72rem; font-weight:600; line-height:1.35;"></div>
        <div id="crmSidebarLookupHistory" style="font-size:0.78rem;"></div>
        <button type="button" id="crmSidebarLookupMoreBtn" class="btn btn-outline btn-sm" style="display:none; margin-top:10px; width:100%; justify-content:center; font-size:0.72rem;">
            <i class="fa-solid fa-clock-rotate-left"></i> View Full History
        </button>
    </div>
</div>
