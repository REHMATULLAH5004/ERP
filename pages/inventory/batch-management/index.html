<div class="module-view-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="margin: 0;">Batch Management</h3>
        <div style="display: flex; gap: 10px; align-items: center;">
            <span style="font-size: 0.9rem; color: #64748b;">
                <i class="fa-solid fa-info-circle"></i> Batches created via Opening Qty or Purchase Orders
            </span>
        </div>
    </div>

    <div style="display: flex; gap: 15px; margin-bottom: 20px;">
        <input type="text" id="searchBatch" placeholder="Search by batch # or product..." style="flex: 1; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px;">
        <select id="filterBatchStatus" style="padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; background: white;">
            <option value="">All Batches</option>
            <option value="expired">Expired</option>
            <option value="expiring_soon">Expiring Soon (30 days)</option>
        </select>
    </div>

    <div class="card" style="padding: 0;">
        <table class="table-minimal">
            <thead>
                <tr>
                    <th style="padding-left: 20px;">Batch #</th>
                    <th>Product Name</th>
                    <th>Expiry Date</th>
                    <th>Cost Price (Per Unit)</th>
                    <th style="text-align: right;">Total Qty</th>
                    <th style="padding-right: 20px; text-align: right;">Total Amount (K)</th>
                </tr>
            </thead>
            <tbody id="batchTableBody">
                <tr>
                    <td colspan="6" style="text-align: center; padding: 30px; color: #94a3b8;">
                        <i class="fa-solid fa-spinner fa-spin"></i> Loading batches...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    document.dispatchEvent(new Event('loadModuleComplete'));
</script>
