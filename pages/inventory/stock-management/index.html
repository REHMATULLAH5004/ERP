<div class="module-view-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="margin: 0;">Stock Takes</h3>
        <div style="display: flex; gap: 10px;">
            <button id="uploadCsvBtn" style="background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer;">
                <i class="fa-solid fa-file-upload"></i> Upload CSV
            </button>
            <button id="newStockTakeBtn" style="background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer;">
                <i class="fa-solid fa-clipboard-check"></i> New Stock Take
            </button>
        </div>
    </div>

    <div class="card" style="padding: 0; overflow: hidden;">
        <table class="table-minimal" id="stockTakeTable">
            <thead>
                <tr>
                    <th style="padding-left: 20px; width: 20%;">Stock Take ID</th>
                    <th style="width: 20%;">Date</th>
                    <th style="width: 20%;">Items Counted</th>
                    <th style="width: 20%;">Total Qty Variance</th>
                    <th style="padding-right: 20px; text-align: right; width: 20%;">Total Amount Variance (K)</th>
                </tr>
            </thead>
            <tbody id="stockTakeTableBody">
                <tr>
                    <td colspan="5" style="text-align: center; padding: 30px; color: #94a3b8;">
                        <i class="fa-solid fa-spinner fa-spin"></i> Loading stock takes...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ============================================ -->
<!-- NEW STOCK TAKE MODAL (Multi-Product) -->
<!-- ============================================ -->
<div id="stockTakeModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 1000px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px;">
            <h3 id="stockTakeTitle" style="margin: 0;"><i class="fa-solid fa-clipboard-check" style="color: #2563eb;"></i> New Stock Take</h3>
            <button id="closeStockTakeBtn" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #64748b;">&times;</button>
        </div>

        <form id="stockTakeForm">
            <div id="productsContainer">
                <!-- Products will be injected dynamically here -->
            </div>

            <div style="margin-top: 20px; display: flex; gap: 10px;">
                <button type="button" id="addProductToTake" style="background: #f1f5f9; border: 1px solid #e2e8f0; padding: 8px 20px; border-radius: 6px; cursor: pointer;">
                    <i class="fa-solid fa-plus"></i> Add Product
                </button>
            </div>

            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid #e2e8f0; padding-top: 20px;">
                <button type="button" id="cancelStockTakeBtn" style="background: white; border: 1px solid #e2e8f0; padding: 10px 25px; border-radius: 6px; cursor: pointer;">Cancel</button>
                <button type="submit" id="saveStockTakeBtn" style="background: #2563eb; color: white; border: none; padding: 10px 25px; border-radius: 6px; cursor: pointer;">
                    <i class="fa-solid fa-floppy-disk"></i> Save Stock Take
                </button>
            </div>
        </form>
    </div>
</div>

<!-- ============================================ -->
<!-- STOCK TAKE DETAILS MODAL (Drill Down) -->
<!-- ============================================ -->
<div id="stockTakeDetailsModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 900px; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px;">
            <h3 id="detailsTitle" style="margin: 0;"><i class="fa-solid fa-receipt" style="color: #2563eb;"></i> Stock Take Details</h3>
            <button id="closeDetailsBtn" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #64748b;">&times;</button>
        </div>
        <div id="detailsContent">
            <p style="text-align: center; color: #94a3b8; padding: 30px;">Loading details...</p>
        </div>
    </div>
</div>

<!-- ============================================ -->
<!-- CSV UPLOAD MODAL -->
<!-- ============================================ -->
<div id="csvUploadModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 600px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px;">
            <h3 style="margin: 0;"><i class="fa-solid fa-file-upload" style="color: #10b981;"></i> Upload Stock Count CSV</h3>
            <button id="closeCsvBtn" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #64748b;">&times;</button>
        </div>
        <div style="padding: 20px 0;">
            <p style="color: #64748b; margin-bottom: 15px;">Upload a CSV file with the following columns:<br>
            <strong>SKU, Batch Number, Expiry Date, Primary Qty, Secondary Qty</strong></p>
            <input type="file" id="csvFileInput" accept=".csv" style="width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 6px; background: white;">
        </div>
        <div style="display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid #e2e8f0; padding-top: 20px;">
            <button type="button" id="cancelCsvBtn" style="background: white; border: 1px solid #e2e8f0; padding: 10px 25px; border-radius: 6px; cursor: pointer;">Cancel</button>
            <button type="button" id="processCsvBtn" style="background: #10b981; color: white; border: none; padding: 10px 25px; border-radius: 6px; cursor: pointer;">
                <i class="fa-solid fa-play"></i> Process CSV
            </button>
        </div>
    </div>
</div>

<script>
    document.dispatchEvent(new Event('loadModuleComplete'));
</script>
