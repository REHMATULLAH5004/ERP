<div class="module-view-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="margin: 0;">Brands</h3>
        <span style="font-size: 0.9rem; color: #64748b;">
            <i class="fa-solid fa-info-circle"></i> Brands are created via Product Master
        </span>
    </div>

    <div class="card" style="padding: 0;">
        <table class="table-minimal">
            <thead>
                <tr>
                    <th style="padding-left: 20px;">Brand Name</th>
                    <th>Supplier</th>
                    <th>Total Products</th>
                    <th style="text-align: right; padding-right: 20px;">Total Cost (K)</th>
                </tr>
            </thead>
            <tbody id="brandTableBody">
                <tr>
                    <td colspan="4" style="text-align: center; padding: 30px; color: #94a3b8;">
                        <i class="fa-solid fa-spinner fa-spin"></i> Loading brands...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ============================================ -->
<!-- HIDDEN PRODUCT LIST MODAL (Pops up) -->
<!-- ============================================ -->
<div id="productListModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 700px; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px;">
            <h3 id="productListTitle" style="margin: 0;"><i class="fa-solid fa-boxes-stacked" style="color: #2563eb;"></i> Products</h3>
            <button id="closeProductListBtn" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #64748b;">&times;</button>
        </div>
        <div id="productListContent" style="padding: 0;">
            <p style="text-align: center; color: #94a3b8; padding: 30px;">Loading products...</p>
        </div>
    </div>
</div>

<script>
    document.dispatchEvent(new Event('loadModuleComplete'));
</script>
