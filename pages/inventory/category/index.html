<div class="module-view-container">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="margin: 0;">Categories</h3>
        <div style="display: flex; align-items: center; gap: 16px;">
            <span style="font-size: 0.9rem; color: #64748b;">
                <i class="fa-solid fa-info-circle"></i> Click a Category to view Sub-Categories
            </span>
            <!-- 🔥 ADDED: Print Stock Take Sheet -- Category+Location ->
                 Sub-Category+Location -> Item+Qty, with a blank column for
                 writing the physical count during an actual stock take. -->
            <button id="printStockTakeSheetBtn" class="btn btn-primary" style="padding: 8px 16px; font-size: 0.85rem;">
                <i class="fa-solid fa-print"></i> Print Stock Take Sheet
            </button>
        </div>
    </div>

    <div class="card" style="padding: 0;">
        <table class="table-minimal" id="categoryTable">
            <thead>
                <tr>
                    <th style="padding-left: 20px; width: 30%;">Category Name</th>
                    <th style="width: 30%;">Location</th>
                    <th style="width: 40%; text-align: right; padding-right: 20px;">Total Products</th>
                </tr>
            </thead>
            <tbody id="categoryTableBody">
                <tr>
                    <td colspan="3" style="text-align: center; padding: 30px; color: #94a3b8;">
                        <i class="fa-solid fa-spinner fa-spin"></i> Loading categories...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ============================================ -->
<!-- HIDDEN SUB-CATEGORY TABLE (Slides open) -->
<!-- ============================================ -->
<div id="subCategoryContainer" style="display: none; margin-top: 10px;">
    <div class="card" style="padding: 0;">
        <div style="padding: 10px 20px; background: #f8fafc; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center;">
            <h4 id="selectedCategoryTitle" style="margin: 0; color: #0f172a;">Sub-Categories</h4>
            <button id="closeSubCategoryBtn" style="background: none; border: none; color: #64748b; cursor: pointer; font-size: 0.9rem;">
                <i class="fa-solid fa-times"></i> Close
            </button>
        </div>
        <table class="table-minimal">
            <thead>
                <tr>
                    <th style="padding-left: 20px;">Sub-Category Name</th>
                    <!-- 🔥 ADDED: Location column -- the JS already
                         fetches and renders sub_categories.location, but
                         this header was missing so it had nowhere to
                         align under. -->
                    <th>Location</th>
                    <th style="text-align: right; padding-right: 20px;">Products Count</th>
                </tr>
            </thead>
            <tbody id="subCategoryTableBody">
                <tr>
                    <!-- 🔥 FIX: colspan updated from 2 to 3 to match the
                         new Location column, so this placeholder row
                         still spans the full table width instead of
                         only covering two of the three columns. -->
                    <td colspan="3" style="text-align: center; padding: 30px; color: #94a3b8;">Select a Category above</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- ============================================ -->
<!-- HIDDEN PRODUCT LIST MODAL (Pops up) -->
<!-- ============================================ -->
<div id="productListModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: white; padding: 30px; border-radius: 12px; width: 90%; max-width: 600px; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px;">
            <h3 id="productListTitle" style="margin: 0;"><i class="fa-solid fa-box-open" style="color: #2563eb;"></i> Products</h3>
            <button id="closeProductListBtn" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #64748b;">&times;</button>
        </div>
        <ul id="productListContent" style="list-style: none; padding: 0; margin: 0;">
            <li style="padding: 15px; text-align: center; color: #94a3b8;">Loading products...</li>
        </ul>
    </div>
</div>

<script>
    document.dispatchEvent(new Event('loadModuleComplete'));
</script>
